<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c61f1"/>
      <stop offset="1" stop-color="#142557"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9ecff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- photo grid / collage -->
  <g transform="translate(96 120)">
    <rect x="0" y="0" width="150" height="110" rx="14" fill="url(#grid)"/>
    <rect x="170" y="0" width="150" height="110" rx="14" fill="url(#grid)" opacity="0.85"/>
    <rect x="0" y="130" width="150" height="110" rx="14" fill="url(#grid)" opacity="0.85"/>
    <rect x="170" y="130" width="150" height="110" rx="14" fill="url(#grid)"/>
    <!-- simple faces -->
    <circle cx="75" cy="44" r="16" fill="#1c61f1" opacity="0.55"/>
    <circle cx="245" cy="44" r="16" fill="#1c61f1" opacity="0.55"/>
    <circle cx="75" cy="174" r="16" fill="#1c61f1" opacity="0.55"/>
    <circle cx="245" cy="174" r="16" fill="#1c61f1" opacity="0.55"/>
    <rect x="55" y="74" width="40" height="6" rx="3" fill="#1c61f1" opacity="0.4"/>
    <rect x="225" y="74" width="40" height="6" rx="3" fill="#1c61f1" opacity="0.4"/>
    <rect x="55" y="204" width="40" height="6" rx="3" fill="#1c61f1" opacity="0.4"/>
    <rect x="225" y="204" width="40" height="6" rx="3" fill="#1c61f1" opacity="0.4"/>
  </g>
  <!-- academic cap -->
  <g transform="translate(256 372)">
    <path d="M-70 -10 L0 -40 L70 -10 L0 20 Z" fill="#ffd166"/>
    <path d="M30 0 L30 30 Q0 44 -30 30 L-30 0" fill="none" stroke="#ffd166" stroke-width="10" stroke-linecap="round"/>
    <rect x="-4" y="-10" width="8" height="26" rx="2" fill="#ffd166"/>
  </g>
</svg>
